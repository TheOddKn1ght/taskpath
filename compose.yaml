services:
  taskpath:
    build: .
    command: ["bun", "run", "${TASKPATH_START_SCRIPT:-start}"]
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      TASKPATH_TIMEZONE: ${TASKPATH_TIMEZONE:-UTC}
      TASKPATH_ORIGIN: ${TASKPATH_ORIGIN:-}
      TASKPATH_SESSION_DAYS: ${TASKPATH_SESSION_DAYS:-30}
      TASKPATH_PUSH_SUBJECT: ${TASKPATH_PUSH_SUBJECT:-}
    volumes:
      - taskpath-accounts-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  taskpath-accounts-data:
